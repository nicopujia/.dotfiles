set -g focus-events on
set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'
set -g mouse on
# set -g pane-border-status top
set -s set-clipboard on
set -g extended-keys on
set -g mode-keys vi
set -g bell-action any
set -g visual-bell on
set -gw monitor-bell on
set -g window-status-bell-style "fg=colour235,bg=colour220,bold"
set -g window-status-format "#{?window_bell_flag,● ,}#I:#W#{?window_flags,#{window_flags}, }"

# --- Survive a lost server -----------------------------------------------
# 2026-08-20: a stray `tmux kill-session -t jri` from an agent killed the only
# session, and with it the server and every other pane. Keep the server up
# when the last session goes, so the rest of the day is not collateral.
set -g exit-empty off
set -g detach-on-destroy off

# --- Plugins (tpm) -------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# Must stay last.
run '~/.tmux/plugins/tpm/tpm'
